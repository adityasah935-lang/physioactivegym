              </a>
            </div>
          </div>
        </section>
      );

      // FAQ SECTION
      const FAQSection = () => {
        const [openId, setOpenId] = useState('faq-1');

        return (
          <section className="py-20 bg-zinc-950 border-t border-zinc-800">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">
              <div className="text-center space-y-2">
                <div className="text-xs font-bold text-orange-500 uppercase tracking-widest">Common Enquiries</div>
                <h2 className="text-4xl sm:text-5xl font-black uppercase font-bebas text-white">
                  FREQUENTLY ASKED <span className="text-orange-500">QUESTIONS</span>
                </h2>
              </div>

              <div className="space-y-4">
                {FAQ_LIST.map((faq) => {
                  const isOpen = openId === faq.id;
                  return (
                    <div key={faq.id} className="rounded-xl bg-zinc-900 border border-zinc-800 overflow-hidden">
                      <button
                        onClick={() => setOpenId(isOpen ? '' : faq.id)}
                        className="w-full px-6 py-4 text-left flex items-center justify-between font-bold text-sm text-white hover:text-orange-400"
                      >
                        <span>{faq.question}</span>
                        <ChevronDownIcon className={`w-5 h-5 text-zinc-400 transition-transform ${isOpen ? 'rotate-180 text-orange-500' : ''}`} />
                      </button>
                      {isOpen && (
                        <div className="px-6 pb-5 pt-1 text-xs text-zinc-300 leading-relaxed border-t border-zinc-800/60">
                          {faq.answer}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </section>
        );
      };

      // LOCATION SECTION
      const LocationSection = () => (
        <section id="location" className="py-20 bg-[#0a0a0c]">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-2 gap-12 items-center">
            <div className="space-y-6">
              <div className="text-xs font-bold text-orange-500 uppercase tracking-widest">Location & Timings</div>
              <h2 className="text-4xl sm:text-5xl font-black uppercase font-bebas text-white">
                VISIT PHYSIOACTIVE <span className="text-orange-500">PRO GYM</span>
              </h2>

              <div className="space-y-4 pt-2">
                <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 flex gap-4">
                  <MapPinIcon className="w-6 h-6 text-orange-500 shrink-0 mt-0.5" />
                  <div>
                    <div className="text-xs font-bold text-zinc-400 uppercase">Address</div>
                    <div className="text-sm font-semibold text-white mt-0.5">{GYM_DETAILS.fullAddress}</div>
                  </div>
                </div>

                <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 flex gap-4">
                  <PhoneIcon className="w-6 h-6 text-orange-500 shrink-0 mt-0.5" />
                  <div>
                    <div className="text-xs font-bold text-zinc-400 uppercase">Direct Contact</div>
                    <a href={GYM_DETAILS.telLink} className="text-sm font-bold text-orange-400 hover:underline block mt-0.5">
                      +91 {GYM_DETAILS.phone}
                    </a>
                  </div>
                </div>

                <div className="p-4 rounded-xl bg-zinc-900 border border-zinc-800 flex gap-4">
                  <ClockIcon className="w-6 h-6 text-orange-500 shrink-0 mt-0.5" />
                  <div>
                    <div className="text-xs font-bold text-zinc-400 uppercase">Gym Working Hours</div>
                    <div className="text-sm font-semibold text-white mt-0.5">Monday – Saturday: 6:00 AM – 10:00 PM</div>
                    <div className="text-xs text-zinc-400">Sunday: Closed / Special Training Sessions</div>
                  </div>
                </div>
              </div>

              <div className="pt-2">
                <a href={GYM_DETAILS.googleMapsUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-6 py-3.5 rounded-xl bg-orange-500 text-black font-extrabold text-xs uppercase tracking-wider hover:bg-orange-400">
                  <span>Get Google Maps Directions</span>
                  <span>↗</span>
                </a>
              </div>
            </div>

            <div className="rounded-2xl overflow-hidden border border-zinc-800 h-[400px] relative bg-zinc-900">
              <iframe
                title="PhysioActive Pro Fitness Gym Location Map"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3773.238491295287!2d72.81230!3d18.96630!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7ce0e05000001%3A0x1!2sTukaram+Javaji+Marg%2C+Grant+Road+West%2C+Tardeo%2C+Mumbai!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin"
                className="w-full h-full border-0 grayscale contrast-125 opacity-80"
                loading="lazy"
              />
            </div>
          </div>
        </section>
      );

      // FINAL CTA
      const FinalCTA = ({ onOpenModal }) => (
        <section className="py-20 bg-zinc-950 border-t border-zinc-800 text-center">
          <div className="max-w-4xl mx-auto px-4 space-y-6">
            <h2 className="text-4xl sm:text-6xl font-black uppercase font-bebas text-white">
              TRANSFORM YOUR BODY AT <span className="text-orange-500">GRANT ROAD</span>
            </h2>
            <p className="text-zinc-300 text-sm max-w-xl mx-auto">
              Join PhysioActive Pro Fitness Gym today and start training with top guidance and equipment.
            </p>
            <div className="flex flex-wrap justify-center gap-4 pt-2">
              <button onClick={onOpenModal} className="px-8 py-4 rounded-xl bg-orange-500 text-black font-extrabold text-xs uppercase tracking-wider hover:bg-orange-400 shadow-xl glow-orange">
                Join Gym Today
              </button>
            </div>
          </div>
        </section>
      );

      // FOOTER
      const Footer = () => (
        <footer className="bg-zinc-950 border-t border-zinc-900 py-12 text-zinc-400 text-xs">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <div className="text-lg font-black text-white font-bebas">PHYSIOACTIVE PRO FITNESS GYM</div>
              <p className="text-zinc-500 mt-1">Grant Road West, Tardeo, Mumbai, Maharashtra 400007</p>
            </div>
            <div className="text-center md:text-right">
              <p>© {new Date().getFullYear()} PhysioActive Pro Fitness Gym. All rights reserved.</p>
            </div>
          </div>
        </footer>
      );

      // APPOINTMENT MODAL
      const AppointmentModal = ({ isOpen, onClose, defaultProgram }) => {
        const [formData, setFormData] = useState({
          fullName: '',
          phone: '',
          preferredDay: 'Today',
          preferredTime: 'Evening (5 PM - 9 PM)',
          interest: defaultProgram || 'General Gym Membership'
        });

        if (!isOpen) return null;

        const handleSubmit = (e) => {
          e.preventDefault();
          const url = WHATSAPP_LINKS.buildAppointmentUrl(formData);
          window.open(url, '_blank');
          onClose();
        };

        return (
          <div className="fixed inset-0 z-[999999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in">
            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-5 relative">
              <button onClick={onClose} className="absolute top-4 right-4 text-zinc-400 hover:text-white">
                <XIcon className="w-5 h-5" />
              </button>

              <div className="space-y-1">
                <h3 className="text-xl font-black uppercase font-bebas text-white">BOOK CONSULTATION</h3>
                <p className="text-xs text-zinc-400">Fill in your details below to schedule your visit.</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-bold text-zinc-300 uppercase mb-1">Full Name</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Amit Kumar"
                    value={formData.fullName}
                    onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-xs outline-none focus:border-orange-500"
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-zinc-300 uppercase mb-1">Phone Number</label>
                  <input
                    type="tel"
                    required
                    placeholder="e.g. 98200 12345"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-xs outline-none focus:border-orange-500"
                  />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-orange-500 text-black font-extrabold text-xs uppercase tracking-wider hover:bg-orange-400">
                  Confirm Via WhatsApp
                </button>
              </form>
            </div>
          </div>
        );
      };

      // MAIN APP COMPONENT
      const App = () => {
        const [modalOpen, setModalOpen] = useState(false);
        const [selectedProgram, setSelectedProgram] = useState('Membership');

        const handleOpenModal = () => {
          setSelectedProgram('Membership');
          setModalOpen(true);
        };

        const handleOpenModalWithProgram = (progName) => {
          setSelectedProgram(progName);
          setModalOpen(true);
        };

        return (
          <div className="min-h-screen bg-[#0a0a0c] text-white font-sans selection:bg-orange-500 selection:text-black relative">
            <IntroLoader />
            <FloatingWhatsApp />
            <div>
              <Navbar onOpenModal={handleOpenModal} />
              <main>
                <Hero onOpenModal={handleOpenModal} />
                <TrustStats />
                <About onOpenModal={handleOpenModal} />
                <Programs onOpenModalWithProgram={handleOpenModalWithProgram} />
                <Facilities />
                <Coaching onOpenModalWithProgram={handleOpenModalWithProgram} />
                <MembershipCTA onOpenModal={handleOpenModal} />
                <AppointmentForm />
                <GoogleReviews />
                <FAQSection />
                <LocationSection />
                <FinalCTA onOpenModal={handleOpenModal} />
              </main>
              <Footer />
              <AppointmentModal
                isOpen={modalOpen}
                onClose={() => setModalOpen(false)}
                defaultProgram={selectedProgram}
              />
            </div>
          </div>
        );
      };

      // Render React App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
